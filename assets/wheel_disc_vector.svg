<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Sector Gradients -->
    <radialGradient id="gradRuby" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#DE1474"/>
      <stop offset="45%" stop-color="#B00A56"/>
      <stop offset="100%" stop-color="#720435"/>
    </radialGradient>

    <radialGradient id="gradTeal" cx="75%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1292AA"/>
      <stop offset="45%" stop-color="#0A6477"/>
      <stop offset="100%" stop-color="#033C48"/>
    </radialGradient>

    <radialGradient id="gradPurple" cx="75%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#9C27B0"/>
      <stop offset="45%" stop-color="#6F1980"/>
      <stop offset="100%" stop-color="#410A4D"/>
    </radialGradient>

    <radialGradient id="gradMidnightTeal" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#0E586E"/>
      <stop offset="50%" stop-color="#073B4B"/>
      <stop offset="100%" stop-color="#02212B"/>
    </radialGradient>

    <radialGradient id="gradAmber" cx="25%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#F57C00"/>
      <stop offset="45%" stop-color="#C75C02"/>
      <stop offset="100%" stop-color="#7A3400"/>
    </radialGradient>

    <radialGradient id="gradAmethyst" cx="25%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="45%" stop-color="#51116D"/>
      <stop offset="100%" stop-color="#300742"/>
    </radialGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldSpoke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BF"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#9A741E"/>
      <stop offset="100%" stop-color="#FEE896"/>
    </linearGradient>

    <radialGradient id="goldMedallion" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF6D1"/>
      <stop offset="35%" stop-color="#F2C75C"/>
      <stop offset="70%" stop-color="#B8861B"/>
      <stop offset="95%" stop-color="#7A5308"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF0B0"/>
      <stop offset="70%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E5A710"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .slice-text {
      font-family: 'Plus Jakarta Sans', 'Montserrat', Arial, sans-serif;
      font-weight: 800;
      fill: #FFFFFF;
      text-anchor: middle;
      filter: url(#textGlow);
      letter-spacing: 0.5px;
    }
    .gold-ornament {
      fill: #FFE285;
      font-size: 16px;
      text-anchor: middle;
      filter: url(#textGlow);
    }
    .spoke-line {
      stroke: url(#goldSpoke);
      stroke-width: 3.5;
      filter: url(#goldGlow);
    }
  </style>

  <!-- 1. BASE CIRCULAR CLIPPING & BACKGROUND -->
  <circle cx="500" cy="500" r="492" fill="#0A020B" stroke="url(#goldSpoke)" stroke-width="5"/>

  <!-- 2. THE 6 SECTOR PIE SLICES (Radius 490, Center 500,500) -->
  <!-- Top: Ruby Magenta (240 to 300 deg) -->
  <path d="M500,500 L255.0,75.7 A490,490 0 0,1 745.0,75.7 Z" fill="url(#gradRuby)"/>

  <!-- Top-Right: Jewel Teal (300 to 360 / 0 deg) -->
  <path d="M500,500 L745.0,75.7 A490,490 0 0,1 990.0,500.0 Z" fill="url(#gradTeal)"/>

  <!-- Bottom-Right: Regal Purple (0 to 60 deg) -->
  <path d="M500,500 L990.0,500.0 A490,490 0 0,1 745.0,924.3 Z" fill="url(#gradPurple)"/>

  <!-- Bottom: Deep Midnight Teal (60 to 120 deg) -->
  <path d="M500,500 L745.0,924.3 A490,490 0 0,1 255.0,924.3 Z" fill="url(#gradMidnightTeal)"/>

  <!-- Bottom-Left: Saffron Amber (120 to 180 deg) -->
  <path d="M500,500 L255.0,924.3 A490,490 0 0,1 10.0,500.0 Z" fill="url(#gradAmber)"/>

  <!-- Top-Left: Amethyst Violet (180 to 240 deg) -->
  <path d="M500,500 L10.0,500.0 A490,490 0 0,1 255.0,75.7 Z" fill="url(#gradAmethyst)"/>

  <!-- 3. INNER 3D CONVEX DEPTH SHADE -->
  <circle cx="500" cy="500" r="490" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="20"/>

  <!-- 4. GOLDEN SPOKE DIVIDERS -->
  <line x1="500" y1="500" x2="255.0" y2="75.7" class="spoke-line"/>
  <line x1="500" y1="500" x2="745.0" y2="75.7" class="spoke-line"/>
  <line x1="500" y1="500" x2="990.0" y2="500.0" class="spoke-line"/>
  <line x1="500" y1="500" x2="745.0" y2="924.3" class="spoke-line"/>
  <line x1="500" y1="500" x2="255.0" y2="924.3" class="spoke-line"/>
  <line x1="500" y1="500" x2="10.0" y2="500.0" class="spoke-line"/>

  <!-- SECTOR 0 (TOP / 12 O CLOCK): FREE BANGLES -->
  <g transform="translate(500, 240)" filter="url(#dropShadow)">
    <g transform="translate(0, -75)">
      <ellipse cx="-10" cy="-6" rx="60" ry="24" fill="none" stroke="#B3861B" stroke-width="12" transform="rotate(-15)"/>
      <ellipse cx="-10" cy="-6" rx="60" ry="24" fill="none" stroke="#FFE082" stroke-width="9" transform="rotate(-15)"/>
      <ellipse cx="-10" cy="-6" rx="60" ry="24" fill="none" stroke="#FFF9C4" stroke-width="3" stroke-dasharray="4,6" transform="rotate(-15)"/>

      <ellipse cx="6" cy="14" rx="64" ry="26" fill="none" stroke="#7A5308" stroke-width="14" transform="rotate(-8)"/>
      <ellipse cx="6" cy="14" rx="64" ry="26" fill="none" stroke="#FFD54F" stroke-width="11" transform="rotate(-8)"/>
      <ellipse cx="6" cy="14" rx="64" ry="26" fill="none" stroke="#FFFDE7" stroke-width="4" stroke-dasharray="5,7" transform="rotate(-8)"/>

      <circle cx="-32" cy="7" r="3.5" fill="#E91E63" stroke="#FFF" stroke-width="1"/>
      <circle cx="-12" cy="16" r="3.5" fill="#E91E63" stroke="#FFF" stroke-width="1"/>
      <circle cx="10" cy="22" r="4" fill="#E91E63" stroke="#FFF" stroke-width="1"/>
      <circle cx="34" cy="21" r="3.5" fill="#E91E63" stroke="#FFF" stroke-width="1"/>
      <circle cx="52" cy="14" r="3" fill="#E91E63" stroke="#FFF" stroke-width="1"/>

      <path d="M-22,-2 L-20,-8 L-18,-2 L-12,0 L-18,2 L-20,8 L-22,2 L-28,0 Z" fill="#FFFFFF"/>
      <path d="M28,8 L29.5,3 L31,8 L36,9.5 L31,11 L29.5,16 L28,11 L23,9.5 Z" fill="#FFFFFF"/>
    </g>

    <text y="40" class="slice-text" font-size="28">FREE</text>
    <text y="72" class="slice-text" font-size="34" letter-spacing="1.5px">BANGLES</text>
    <text y="96" class="gold-ornament">— ✦ —</text>
  </g>

  <!-- SECTOR 1 (TOP-RIGHT / 2 O CLOCK): GIFT HAMPERS -->
  <g transform="translate(735, 360)" filter="url(#dropShadow)">
    <g transform="translate(20, -55)">
      <rect x="-38" y="-12" width="76" height="64" rx="4" fill="#E8B95A" stroke="#8F6815" stroke-width="2.5"/>
      <rect x="-38" y="-12" width="76" height="32" rx="4" fill="#FCE38A"/>
      <rect x="-10" y="-12" width="20" height="64" fill="#B71C1C" stroke="#D32F2F" stroke-width="1.5"/>
      <rect x="-6" y="-12" width="12" height="64" fill="#E53935"/>
      <rect x="-42" y="-18" width="84" height="15" rx="3" fill="#FFE599" stroke="#9A7017" stroke-width="2"/>
      <rect x="-11" y="-18" width="22" height="15" fill="#D32F2F"/>
      <path d="M-2,-18 C-18,-38 -36,-26 -14,-15 Z" fill="#E53935" stroke="#B71C1C" stroke-width="2"/>
      <path d="M-2,-18 C-14,-32 -28,-22 -12,-16 Z" fill="#FF8A80"/>
      <path d="M2,-18 C18,-38 36,-26 14,-15 Z" fill="#E53935" stroke="#B71C1C" stroke-width="2"/>
      <path d="M2,-18 C14,-32 28,-22 12,-16 Z" fill="#FF8A80"/>
      <circle cx="0" cy="-17" r="6" fill="#FFD54F" stroke="#9A7017" stroke-width="1.5"/>
      <rect x="22" y="16" width="34" height="34" rx="3" fill="#7B1FA2" stroke="#4A148C" stroke-width="2"/>
      <rect x="33" y="16" width="10" height="34" fill="#FFD54F"/>
      <rect x="20" y="14" width="38" height="9" rx="2" fill="#BA68C8"/>
      <path d="M-30,-28 L-28,-34 L-26,-28 L-20,-26 L-26,-24 L-28,-18 L-30,-24 L-36,-26 Z" fill="#FFF9C4"/>
    </g>

    <text x="-35" y="24" class="slice-text" font-size="28">GIFT</text>
    <text x="-35" y="58" class="slice-text" font-size="33" letter-spacing="1px">HAMPERS</text>
    <text x="-35" y="85" class="gold-ornament">— ✦ —</text>
  </g>

  <!-- SECTOR 2 (BOTTOM-RIGHT / 4 O CLOCK): CRACKERS -->
  <g transform="translate(735, 640)" filter="url(#dropShadow)">
    <g transform="translate(20, -45) rotate(-35)">
      <line x1="0" y1="20" x2="0" y2="90" stroke="#FFE082" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="-16" y="-22" width="32" height="52" rx="3" fill="#D32F2F" stroke="#FFE082" stroke-width="2.5"/>
      <path d="M-16,-10 L-6,-3 L4,-10 L14,-3 L16,-4 L16,4 L6,-3 L-4,4 L-14,-3 L-16,-2 Z" fill="#FFD54F"/>
      <path d="M-16,8 L-6,15 L4,8 L14,15 L16,14 L16,22 L6,15 L-4,22 L-14,15 L-16,16 Z" fill="#FFD54F"/>
      <polygon points="0,-48 -20,-22 20,-22" fill="#E53935" stroke="#FFE082" stroke-width="2.5"/>
      <circle cx="0" cy="22" r="7" fill="#FFF59D"/>
      <circle cx="0" cy="22" r="3" fill="#FFFFFF"/>
      <line x1="-12" y1="28" x2="-22" y2="38" stroke="#FFD54F" stroke-width="2.5"/>
      <line x1="12" y1="28" x2="22" y2="38" stroke="#FFD54F" stroke-width="2.5"/>
      <line x1="0" y1="30" x2="0" y2="44" stroke="#FFF" stroke-width="2.5"/>
      <circle cx="-28" cy="-35" r="3" fill="#FFE082"/>
      <circle cx="28" cy="-25" r="3.5" fill="#FFF"/>
      <circle cx="34" cy="5" r="2.5" fill="#FFE082"/>
    </g>

    <text x="-35" y="32" class="slice-text" font-size="34" letter-spacing="1.5px">CRACKERS</text>
    <text x="-35" y="65" class="gold-ornament">— ♡ —</text>
  </g>

  <!-- SECTOR 3 (BOTTOM / 6 O CLOCK): EXTRA 5% OFFERS -->
  <g transform="translate(500, 755)" filter="url(#dropShadow)">
    <path d="M-125,-15 L-122,-24 L-119,-15 L-110,-12 L-119,-9 L-122,0 L-125,-9 L-134,-12 Z" fill="#FFE082"/>
    <path d="M125,-15 L128,-24 L131,-15 L140,-12 L131,-9 L128,0 L125,-9 L116,-12 Z" fill="#FFE082"/>

    <path d="M-105,45 L-103,38 L-101,45 L-94,47 L-101,49 L-103,56 L-105,49 L-112,47 Z" fill="#FFF"/>
    <path d="M105,45 L107,38 L109,45 L116,47 L109,49 L107,56 L105,49 L98,47 Z" fill="#FFF"/>

    <text y="-48" class="slice-text" font-size="28" fill="#FFF2BF" letter-spacing="3px">EXTRA</text>
    <text y="24" font-family="'Plus Jakarta Sans', 'Montserrat', Arial Black, sans-serif" font-weight="900" font-size="76" fill="url(#goldTextGrad)" text-anchor="middle" filter="url(#textGlow)" letter-spacing="-1px">5%</text>
    <text y="74" class="slice-text" font-size="30" letter-spacing="3px">OFFERS</text>
    <text y="104" class="gold-ornament">— ♡ —</text>
  </g>

  <!-- SECTOR 4 (BOTTOM-LEFT / 8 O CLOCK): FREE TOPS -->
  <g transform="translate(265, 640)" filter="url(#dropShadow)">
    <g transform="translate(-20, -50)">
      <path d="M-28,-22 C-15,-22 -8,-10 0,-10 C8,-10 15,-22 28,-22 L40,-8 L28,0 L32,46 L-32,46 L-28,0 L-40,-8 Z" fill="#E91E63" stroke="#880E4F" stroke-width="2.5"/>
      <path d="M-22,-18 C-10,-18 -4,-10 0,-10 C4,-10 10,-18 22,-18 L30,-6 L22,0 L26,42 L-26,42 L-22,0 L-30,-6 Z" fill="#F06292" opacity="0.65"/>
      <path d="M-15,-22 C-8,-10 0,-6 0,-6 C0,-6 8,-10 15,-22" fill="none" stroke="#FFE082" stroke-width="4" stroke-linecap="round"/>
      <path d="M-40,-8 L-28,0" stroke="#FFE082" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M40,-8 L28,0" stroke="#FFE082" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-32" y1="46" x2="32" y2="46" stroke="#FFE082" stroke-width="3.5"/>
      <path d="M24,-24 L25.5,-29 L27,-24 L32,-22.5 L27,-21 L25.5,-16 L24,-21 L19,-22.5 Z" fill="#FFFFFF"/>
    </g>

    <text x="35" y="24" class="slice-text" font-size="28">FREE</text>
    <text x="35" y="58" class="slice-text" font-size="34" letter-spacing="1.5px">TOPS</text>
    <text x="35" y="85" class="gold-ornament">— ✦ —</text>
  </g>

  <!-- SECTOR 5 (TOP-LEFT / 10 O CLOCK): ₹1200 WORTH BLOUSE -->
  <g transform="translate(265, 360)" filter="url(#dropShadow)">
    <g transform="translate(-20, -55)">
      <path d="M-34,-20 C-18,-20 -10,-4 0,-4 C10,-4 18,-20 34,-20 L48,-6 L34,4 L38,48 L-38,48 L-34,4 L-48,-6 Z" fill="#C2185B" stroke="#4A001E" stroke-width="2.5"/>
      <path d="M-28,-16 C-14,-16 -6,-4 0,-4 C6,-4 14,-16 28,-16 L40,-4 L28,4 L32,44 L-32,44 L-28,4 L-40,-4 Z" fill="#AD1457"/>
      <path d="M-18,-20 C-10,-4 0,0 0,0 C0,0 10,-4 18,-20" fill="none" stroke="#FFE082" stroke-width="5" stroke-linecap="round"/>
      <path d="M-18,-20 C-10,-4 0,0 0,0 C0,0 10,-4 18,-20" fill="none" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-48,-6 L-34,4" stroke="#FFE082" stroke-width="5" stroke-linecap="round"/>
      <path d="M48,-6 L34,4" stroke="#FFE082" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-16" cy="18" r="4.5" fill="#FFE082" stroke="#8F6E1D" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#FFE082" stroke="#8F6E1D" stroke-width="1"/>
      <circle cx="0" cy="24" r="5" fill="#FFE082" stroke="#8F6E1D" stroke-width="1"/>
      <line x1="-38" y1="48" x2="38" y2="48" stroke="#FFE082" stroke-width="4.5"/>
      <path d="M-28,-28 L-26,-34 L-24,-28 L-18,-26 L-24,-24 L-26,-18 L-28,-24 L-34,-26 Z" fill="#FFFDE7"/>
    </g>

    <text x="35" y="24" class="slice-text" font-size="34" letter-spacing="1px">₹1200</text>
    <text x="35" y="55" class="slice-text" font-size="20" letter-spacing="1px">WORTH BLOUSE</text>
    <text x="35" y="82" class="gold-ornament">— ♡ —</text>
  </g>

  <!-- 6. CENTRAL GOLDEN LOTUS MEDALLION -->
  <g transform="translate(500, 500)" filter="url(#dropShadow)">
    <circle cx="0" cy="4" r="98" fill="rgba(0,0,0,0.6)"/>

    <circle cx="0" cy="0" r="94" fill="url(#goldMedallion)" stroke="#FFECA9" stroke-width="3"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#7A5308" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="80" fill="url(#goldMedallion)"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FFF2BF" stroke-width="2"/>

    <circle cx="0" cy="0" r="68" fill="url(#goldMedallion)" stroke="#8F6815" stroke-width="1.8"/>

    <g transform="translate(0, -3) scale(0.85)">
      <path d="M0,-42 C-7,-22 -10,-6 0,16 C10,-6 7,-22 0,-42 Z" fill="#1A0311" stroke="#FEE896" stroke-width="1.8"/>
      <path d="M0,16 C-18,6 -34,-2 -36,-18 C-20,-16 -8,-4 0,16 Z" fill="#1A0311" stroke="#FEE896" stroke-width="1.8"/>
      <path d="M0,16 C18,6 34,-2 36,-18 C20,-16 8,-4 0,16 Z" fill="#1A0311" stroke="#FEE896" stroke-width="1.8"/>
      <path d="M0,16 C-24,18 -42,16 -46,2 C-30,2 -14,8 0,16 Z" fill="#1A0311" stroke="#FEE896" stroke-width="1.5"/>
      <path d="M0,16 C24,18 42,16 46,2 C30,2 14,8 0,16 Z" fill="#1A0311" stroke="#FEE896" stroke-width="1.5"/>
      <path d="M-18,22 C-8,28 8,28 18,22" stroke="#FEE896" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="27" r="2.5" fill="#FEE896"/>
    </g>

    <circle cx="0" cy="0" r="3" fill="#FFE082"/>
  </g>

</svg>
